<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="imagens/favicon-money.png" type="image/x-icon">
    <title>Controle Financeiro</title>
</head>
<body>
    <main>
        <section class="conteudo">
            
            <header class="cabecalho">
                <h1>Controle Financeiro</h1>
                <p>Organize seus gastos, um passo de cada vez.</p>
                <hr>
            </header>
            
            <section>
                <article class="container_principal">
                    <div class="card_principal">
                        <div class="card_caixas">
                            <div class="caixa_valor">
                                <label for="valor" class="titulo_caixas">Valor</label>
                                <input type="number" id="valor" name="valor" placeholder="R$0,00" step="0.01" required>
                                <span id="erro-valor" class="erro-mensagem"></span>
                            </div>
                            
                            <div class="caixa_categoria">
                                <label for="categoria" class="titulo_caixas">Categoria</label>
                                <select name="categoria" id="categoria">
                                    <option value="" disabled selected>Selecione a Categoria</option>
                                    <option value="alimentacao">Alimentação</option>
                                    <option value="transporte">Transporte</option>
                                    <option value="lazer">Lazer</option>
                                    <option value="outros">Outros</option>
                                </select>
                                <span id="erro-categoria" class="erro-mensagem"></span>
                            </div>
                        </div>
                        
                        <div class="botao">
                            <button type="button" id="btn-adicionar">Adicionar</button>
                        </div>
                    </div>
                </article>
                
                <article class="container_secundario">
                    <div class="card_categorias">
                        <div class="alimentacao">
                            <img class="img_card" src="imagens/pizza.png" alt="Ícone Alimentação">
                            <p>Alimentação</p>
                            <p class="valor_box" id="alimentacao">R$ 0,00</p>
                        </div>
                        <div class="transporte">
                            <img class="img_card" src="imagens/bicicleta.png" alt="Ícone Transporte">
                            <p>Transporte</p>
                            <p class="valor_box" id="transporte">R$ 0,00</p>
                        </div>
                        <div class="lazer">
                            <img class="img_card" src="imagens/cerveja.png" alt="Ícone Lazer">
                            <p>Lazer</p>
                            <p class="valor_box" id="lazer">R$ 0,00</p>
                        </div>
                        <div class="outros">
                            <img class="img_card" src="imagens/conta.png" alt="Ícone Outros">
                            <p>Outros</p>
                            <p class="valor_box" id="outros">R$ 0,00</p>
                        </div>
                    </div>
                    
                    <article class="total">
                        <div class="card_total">
                            <img class="img_total" src="imagens/flecha.png" alt="">
                            <div class="container_total">
                                <p class="total_box">TOTAL</p>
                                <h2 id="total">R$ 0,00</h2>
                            </div>
                            <img class="img_total" src="imagens/felcha-direita.png" alt="">
                        </div>
                    </article>
                </article>
            </section>
            
        </section> 
    </main>

    <footer>
        <p>Desenvolvido com 💗 por Laura Tomazelli.</p>
    </footer>

    <script src="js/app.js" type="module"></script>
</body>
</html>
